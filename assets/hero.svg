<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Okymi — cybersecurity student and open-source builder</title>
  <desc id="desc">A dark terminal-inspired profile banner with a violet and teal security operations motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="screen"><rect x="30" y="30" width="1140" height="300" rx="22"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .scan { animation: scan 7s linear infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .signal { stroke-dasharray: 8 10; animation: flow 4s linear infinite; }
      @keyframes scan { from { transform: translateY(-360px); } to { transform: translateY(360px); } }
      @keyframes blink { 0%, 46% { opacity: 1; } 47%, 100% { opacity: 0; } }
      @keyframes flow { to { stroke-dashoffset: -36; } }
      @media (prefers-reduced-motion: reduce) { .scan, .cursor, .signal { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="30" y="30" width="1140" height="300" rx="22" fill="url(#grid)" stroke="#334155"/>
  <circle cx="1030" cy="72" r="230" fill="url(#glow)"/>
  <g clip-path="url(#screen)" opacity="0.42">
    <rect class="scan" x="30" y="-50" width="1140" height="90" fill="url(#accent)" opacity="0.06"/>
  </g>

  <g transform="translate(82 77)">
    <path d="M60 0 112 30v60l-52 30L8 90V30Z" fill="#111827" stroke="url(#accent)" stroke-width="3"/>
    <path d="M38 39 52 25h27l14 14v27L79 81H52L38 67Z" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.9"/>
    <path d="m49 60 9 9 21-24" fill="none" stroke="#2dd4bf" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
    <circle cx="60" cy="60" r="48" fill="none" stroke="#64748b" stroke-dasharray="2 8"/>
  </g>

  <g class="sans" transform="translate(246 76)">
    <text x="0" y="18" fill="#94a3b8" font-size="15" font-weight="600" letter-spacing="3">SECURITY ENGINEERING / OPEN SOURCE</text>
    <text x="0" y="106" fill="#f8fafc" font-size="76" font-weight="760" letter-spacing="-3">OKYMI</text>
    <rect x="2" y="128" width="610" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="0" y="169" fill="#cbd5e1" font-size="22" font-weight="520">Cybersecurity student building practical operator tooling.</text>
  </g>

  <g class="mono" transform="translate(82 296)">
    <text x="0" y="0" fill="#2dd4bf" font-size="17">okymi@github:~$</text>
    <text x="184" y="0" fill="#e2e8f0" font-size="17">ship --secure --repeatable</text>
    <rect class="cursor" x="448" y="-16" width="10" height="21" rx="1" fill="#a78bfa"/>
  </g>

  <g transform="translate(898 243)">
    <path class="signal" d="M0 28h40l16-20 22 40 18-28h88" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-width="3"/>
    <circle cx="184" cy="20" r="5" fill="#2dd4bf"/>
    <text class="mono" x="0" y="72" fill="#64748b" font-size="13" letter-spacing="2">BUILDING IN PUBLIC</text>
  </g>
</svg>
