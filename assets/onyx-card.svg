    <text x="748" y="140" fill="#625d56" font-size="13">commands</text>
    <text x="900" y="108" fill="#171717" font-size="38" font-weight="700">36</text>
    <text x="900" y="140" fill="#625d56" font-size="13">references</text>
    <text x="1052" y="108" fill="#171717" font-size="38" font-weight="700">3</text>
    <text x="1052" y="140" fill="#625d56" font-size="13">posts</text>
