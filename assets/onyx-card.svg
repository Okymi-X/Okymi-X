  <rect width="1200" height="240" fill="#f1eee8"/>
  <rect y="232" width="1200" height="8" fill="#e85d3f"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="96" fill="#171717" font-size="68" font-weight="700" letter-spacing="-3">ONYX</text>
    <text x="51" y="136" fill="#45413c" font-size="24">The red-team playbook, searchable.</text>
    <text x="51" y="184" fill="#c7462c" font-size="18" font-weight="700">notes.okymi.tech</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <line x1="720" y1="48" x2="720" y2="190" stroke="#cbc5bb"/>
