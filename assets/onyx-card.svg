<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Onyx red-team knowledge base</title>
  <desc id="desc">A project card for Onyx with 273 commands, 36 reference notes, and 3 posts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 93px 82px; }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="22" fill="url(#bg)" stroke="#334155"/>
  <rect x="1" y="1" width="1198" height="4" rx="2" fill="url(#line)"/>
  <circle cx="93" cy="82" r="73" fill="url(#orb)"/>
  <g transform="translate(53 43)">
    <path d="M40 0 74 20v40L40 80 6 60V20Z" fill="#15172c" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M24 53 39 18l17 19-13 8 13 17" fill="none" stroke="#a78bfa" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
    <circle class="pulse" cx="40" cy="40" r="31" fill="none" stroke="#2dd4bf" stroke-opacity="0.7"/>
  </g>

  <g class="sans" transform="translate(174 48)">
    <text x="0" y="25" fill="#f8fafc" font-size="34" font-weight="750">ONYX</text>
    <text x="0" y="59" fill="#a78bfa" font-size="18" font-weight="650" letter-spacing="1.5">RED-TEAM KNOWLEDGE BASE</text>
    <text x="0" y="103" fill="#cbd5e1" font-size="23">The red-team playbook, searchable.</text>
    <text x="0" y="139" fill="#94a3b8" font-size="16">Verified command references, Active Directory attack chains, and hands-on write-ups.</text>
    <text class="mono" x="0" y="184" fill="#2dd4bf" font-size="16">notes.okymi.tech  →</text>
  </g>

  <g class="sans" transform="translate(816 48)">
    <g>
      <rect width="112" height="112" rx="16" fill="#0f172a" stroke="#334155"/>
      <text x="56" y="52" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="740">273</text>
      <text x="56" y="80" text-anchor="middle" fill="#94a3b8" font-size="13">COMMANDS</text>
    </g>
    <g transform="translate(128)">
      <rect width="112" height="112" rx="16" fill="#0f172a" stroke="#334155"/>
      <text x="56" y="52" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="740">36</text>
      <text x="56" y="80" text-anchor="middle" fill="#94a3b8" font-size="13">REFERENCES</text>
    </g>
    <g transform="translate(256)">
      <rect width="112" height="112" rx="16" fill="#0f172a" stroke="#334155"/>
      <text x="56" y="52" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="740">3</text>
      <text x="56" y="80" text-anchor="middle" fill="#94a3b8" font-size="13">POSTS</text>
    </g>
    <text class="mono" x="0" y="151" fill="#64748b" font-size="13">AD  /  AD CS  /  KERBEROS  /  BLOODHOUND</text>
  </g>
</svg>
