      <text x="38" y="44" text-anchor="middle" fill="#ef4444" font-size="18" font-weight="800">RH</text>
      <text x="68" y="34" fill="#94a3b8" font-size="12" font-weight="650" letter-spacing="1">RED HAT</text>
