      <text x="20" y="95" fill="#f8fafc" font-size="17" font-weight="720">SYSTEM</text>
      <text x="20" y="117" fill="#f8fafc" font-size="17" font-weight="720">ADMINISTRATION I</text>
      <text class="mono" x="20" y="143" fill="#94a3b8" font-size="12">FEB 2026</text>
