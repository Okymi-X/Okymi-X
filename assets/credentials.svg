<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Selected cybersecurity credentials</title>
  <desc id="desc">Selected credentials from Hack The Box, Red Hat, APIsec University, and Cisco Networking Academy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .card { fill: #0f172a; stroke: #273449; }
      .seal { fill: #111827; stroke: #475569; }
      .mark { animation: signal 3.6s ease-in-out infinite; }
      @keyframes signal { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="338" rx="22" fill="url(#bg)" stroke="#334155"/>
  <text class="sans" x="44" y="54" fill="#f8fafc" font-size="26" font-weight="740">SELECTED CREDENTIALS</text>
  <text class="mono" x="44" y="82" fill="#64748b" font-size="13" letter-spacing="1.7">PRACTICAL LABS · SYSTEMS · API SECURITY · NETWORKING</text>
  <rect x="44" y="100" width="1112" height="2" rx="1" fill="url(#accent)" opacity="0.75"/>

  <g class="sans" transform="translate(44 128)">
    <g>
      <rect class="card" width="212" height="164" rx="16"/>
      <circle class="seal" cx="38" cy="38" r="20"/>
      <path class="mark" d="m29 38 7 7 12-15" fill="none" stroke="#9fef00" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
      <text x="68" y="34" fill="#94a3b8" font-size="12" font-weight="650" letter-spacing="1">HACK THE BOX</text>
      <text x="68" y="53" fill="#64748b" font-size="11">PRO LAB</text>
      <text x="20" y="101" fill="#f8fafc" font-size="22" font-weight="720">DANTE</text>
      <text class="mono" x="20" y="133" fill="#94a3b8" font-size="12">MAY 2026</text>
    </g>

    <g transform="translate(225)">
      <rect class="card" width="212" height="164" rx="16"/>
      <circle class="seal" cx="38" cy="38" r="20"/>
      <path class="mark" d="m29 38 7 7 12-15" fill="none" stroke="#9fef00" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
      <text x="68" y="34" fill="#94a3b8" font-size="12" font-weight="650" letter-spacing="1">HACK THE BOX</text>
      <text x="68" y="53" fill="#64748b" font-size="11">PRO LAB</text>
      <text x="20" y="101" fill="#f8fafc" font-size="22" font-weight="720">ZEPHYR</text>
      <text class="mono" x="20" y="133" fill="#94a3b8" font-size="12">AUG 2026</text>
